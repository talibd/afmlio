<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project — AFM Portfolio</title>
    <link rel="stylesheet" href="css/app.css" />

  <body class="ob">
    <a class="skip" href="#main">Skip to content</a>
    <header class="ob-top">
      <a class="mark" href="index.html">
        <i class="mark-stamp" aria-hidden="true"></i>
        <strong>AFM</strong>
      </a>
      <p class="ob-progress">4 of 5</p>

    <div class="ob-rail" aria-hidden="true"><i style="width: 80%"></i></div>
    <main id="main" class="ob-main">
      <h1>One project, in words</h1>
      <p class="lede">The photo is already in. Name it, then say what you built.</p>
      <form action="onboarding-5.html" method="get">
        <label class="field">
          <span>Project name</span>
          <input type="text" name="project" placeholder="Campus Connect" required />

        <label class="field">
          <span>What you built</span>
          <textarea name="built" placeholder="A directory where AFM students publish work and recruiters can filter by skill. I designed the schema, built the public pages, and shipped the first search."></textarea>
        </label>
        <div class="ob-nav">
          <a class="btn btn-ghost" href="onboarding-3.html">Go back</a>
          <button class="btn btn-primary" type="submit">Continue</button>
        </div>
      </form>
    </main>
