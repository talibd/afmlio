<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Name — AFM Portfolio</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="ob">
    <a class="skip" href="#main">Skip to content</a>
    <header class="ob-top">
      <a class="mark" href="index.html">
        <i class="mark-stamp" aria-hidden="true"></i>
        <strong>AFM</strong>
      </a>
      <p class="ob-progress">1 of 5</p>

      <h1>Your name and title</h1>
      <p class="lede">This sits at the top of your page.</p>
      <form action="onboarding-2.html" method="get">
        <label class="field">
          <span>Name</span>
          <input type="text" name="name" placeholder="Talib Khan" required />
        </label>
        <label class="field">
          <span>Professional title</span>
          <input type="text" name="title" placeholder="Full stack developer" required />
        </label>
        <div class="ob-nav">
          <a class="btn btn-ghost" href="onboarding-media.html">Go back</a>
          <button class="btn btn-primary" type="submit">Continue</button>
        </div>
      </form>
