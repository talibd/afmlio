<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Template — AFM Portfolio</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="ob">
    <a class="skip" href="#main">Skip to content</a>
    <header class="ob-top">
      <a class="mark" href="index.html">
        <i class="mark-stamp" aria-hidden="true"></i>
        <strong>AFM</strong>
      </a>
      <p class="ob-progress">5 of 5</p>
    </header>
    <div class="ob-rail" aria-hidden="true"><i style="width: 100%"></i></div>
    <main id="main" class="ob-main">
      <h1>Choose a layout</h1>
      <p class="lede">You bring the content. The template owns spacing and type.</p>
      <div class="templates">
        <button class="choice" type="button" data-choice aria-pressed="true">
          <span>
            <strong>Developer</strong>
            <small>Ink-first. Project still on top.</small>
          </span>
          <span class="check" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>
          </span>
        </button>
        <button class="choice" type="button" data-choice aria-pressed="false">
          <span>
            <strong>Creative</strong>
            <small>Large image, short copy, more air.</small>
          </span>
          <span class="check" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>
          </span>
        </button>
        <button class="choice" type="button" data-choice aria-pressed="false">
          <span>
            <strong>Professional</strong>
            <small>Name, intro, one featured case.</small>
          </span>
          <span class="check" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7" /></svg>
          </span>
        </button>
      </div>
    </main>
    <div class="ob-nav">
      <a class="btn btn-ghost" href="onboarding-4.html">Go back</a>
      <a class="btn btn-primary" href="dashboard.html">Continue</a>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
