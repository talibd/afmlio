<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skills — AFM Portfolio</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="ob">
    <a class="skip" href="#main">Skip to content</a>
    <header class="ob-top">
      <a class="mark" href="index.html">
        <i class="mark-stamp" aria-hidden="true"></i>
        <strong>AFM</strong>
      </a>
      <p class="ob-progress">3 of 5</p>
    </header>
    <div class="ob-rail" aria-hidden="true"><i style="width: 60%"></i></div>
    <main id="main" class="ob-main">
      <h1>Skills for your page</h1>
      <p class="lede">Names only. The template decides how they look.</p>
      <div class="skill-row">
        <label class="field">
          <span>Skill name</span>
          <input id="skill-name" type="text" placeholder="React" />
        </label>
        <button class="btn btn-outline" type="button" data-add-skill>Add</button>
      </div>
      <div class="chips" data-chips>
        <span class="chip"><span>TypeScript</span><button type="button" aria-label="Remove TypeScript">&times;</button></span>
        <span class="chip"><span>Node.js</span><button type="button" aria-label="Remove Node.js">&times;</button></span>
      </div>
      <p class="hint">Figma, Python, SQL, After Effects…</p>
    </main>
    <div class="ob-nav">
      <a class="btn btn-ghost" href="onboarding-2.html">Go back</a>
      <a class="btn btn-primary" href="onboarding-4.html">Continue</a>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
