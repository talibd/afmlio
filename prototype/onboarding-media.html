<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photos — AFM Portfolio</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="ob">
    <a class="skip" href="#main">Skip to content</a>
    <header class="ob-top">
      <a class="mark" href="index.html">
        <i class="mark-stamp" aria-hidden="true"></i>
        <strong>AFM</strong>
      </a>
      <p class="ob-progress">Photos</p>
    </header>
    <div class="ob-rail" aria-hidden="true"><i style="width: 12%"></i></div>
    <main id="main" class="ob-main">
      <h1>Photos first</h1>
      <p class="lede">Click a row. The template places them.</p>
      <div class="upload-list">
        <div data-pick>
          <input type="file" accept="image/*" hidden />
          <div class="preview upload-preview" role="button" tabindex="0" data-alt="Profile photo">
            <div class="upload-meta">
              <strong>Profile photo</strong>
              <p class="preview-empty hint">Click to add a headshot</p>
            </div>
            <svg class="ico ico-mute" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <path d="M17 8l-5-5-5 5M12 3v12" />
            </svg>
          </div>
        </div>
        <div data-pick>
          <input type="file" accept="image/*" hidden />
          <div class="preview upload-preview" role="button" tabindex="0" data-alt="Featured project">
            <div class="upload-meta">
              <strong>Featured project</strong>
              <p class="preview-empty hint">Click to add a still</p>
            </div>
            <svg class="ico ico-mute" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <path d="M17 8l-5-5-5 5M12 3v12" />
            </svg>
          </div>
        </div>
        <div data-pick>
          <input type="file" accept="image/*" hidden />
          <div class="preview upload-preview" role="button" tabindex="0" data-alt="Second project">
            <div class="upload-meta">
              <strong>Second project</strong>
              <p class="preview-empty hint">Optional</p>
            </div>
            <svg class="ico ico-mute" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <path d="M17 8l-5-5-5 5M12 3v12" />
            </svg>
          </div>
        </div>
      </div>
      <p class="note">Need a profile photo and a featured still.</p>
    </main>
    <div class="ob-nav">
      <a class="btn btn-ghost" href="signup.html">Go back</a>
      <a class="btn btn-primary" href="onboarding-1.html">Continue</a>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
